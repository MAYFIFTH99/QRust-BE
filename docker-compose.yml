services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_DATABASE: qrust
      MYSQL_USER: spring
      MYSQL_PASSWORD: alstjrwnsgud
      MYSQL_ROOT_PASSWORD: alstjrwnsgud
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: miniospring
      MINIO_ROOT_PASSWORD: minioalstjrwnsgud
    volumes:
      - minio-data:/data
    networks:
      - backend
    command: server --console-address ":9090" /data

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=alstjrwnsgud
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - backend

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  backend:
    driver: bridge