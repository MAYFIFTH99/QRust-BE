# jenkins-values.yaml
# Helm을 사용하여 Jenkins를 설치할 때 사용할 설정 값들입니다.

# --- 1. Jenkins 컨트롤러(마스터) 설정 ---
controller:
  # 파이프라인 실행에 필요한 필수 플러그인 목록
  installPlugins:
    - kubernetes:1.31.2         # Kubernetes와 연동하여 동적 에이전트를 사용
    - workflow-aggregator:2.6   # Jenkins 파이프라인 핵심 플러그인
    - git:4.11.3                # Git 연동
    - docker-workflow:1.28      # 파이프라인에서 Docker 명령어 사용
    - credentials-binding:1.27  # Credentials를 환경변수로 주입
    - blueocean:1.25.3          # 최신 파이프라인 UI

  # Jenkins가 K8s 클러스터와 통신하기 위한 서비스 계정 생성
  serviceAccount:
    create: true
    name: jenkins-controller

  # Jenkins 데이터를 영구적으로 저장하기 위한 설정
  persistence:
    enabled: true
    # 중요: 사용하시는 클라우드 환경에 맞는 StorageClass 이름을 적어주세요.
    # 예: AWS -> "gp2", GKE -> "standard", Azure -> "managed-premium"
    storageClassName: "default"
    size: "10Gi"

# --- 2. Jenkins 에이전트(빌드 작업용 파드) 설정 ---
agent:
  # 빌드에 사용할 에이전트 파드의 기본 템플릿
  # 'qrust-build-agent'라는 이름의 커스텀 이미지를 사용하도록 설정합니다.
  # 이 이미지는 아래에서 Dockerfile로 만들 예정입니다.
  defaults:
    label: "qrust-build-agent"
    yaml: |
      apiVersion: v1
      kind: Pod
      spec:
        containers:
        - name: jnlp
          image: "jenkins/inbound-agent:4.11.2-4"
          args: ['$(JENKINS_SECRET)', '$(JENKINS_NAME)']
        - name: build-tools
          # 중요: 이 이미지는 직접 빌드하여 레지스트리에 푸시해야 합니다.
          image: your-docker-registry/qrust-build-agent:latest
          command: ["sleep"]
          args: ["99d"]
          # Docker-in-Docker를 위한 설정
          env:
          - name: DOCKER_HOST
            value: tcp://localhost:2375
        - name: dind
          image: docker:20.10.7-dind
          privileged: true
          volumeMounts:
          - name: dind-storage
            mountPath: /var/lib/docker
        volumes:
        - name: dind-storage
          emptyDir: {}

# --- 3. Jenkins UI 접속 설정 ---
service:
  # 클라우드 환경에서 외부 IP를 할당받기 위해 LoadBalancer 타입 사용
  type: LoadBalancer
  port: 8080

# --- 4. 권한 설정 (RBAC) ---
# Jenkins가 에이전트 파드를 생성하고 관리할 수 있도록 권한 부여
rbac:
  create: true
