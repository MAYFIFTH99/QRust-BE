apiVersion: v1
kind: ConfigMap
metadata:
  name: qrust-config
data:
  # Deployment에서 참조할 값들
  DB_HOST: "your-db-host" # 실제 DB 호스트로 변경 필요
  DB_PORT: "3306"
  DB_NAME: "qrust"
  REDIS_HOST: "your-redis-host" # 실제 Redis 호스트로 변경 필요
  GOOGLE_SAFE_BROWSING_BASE_URL: "https://safebrowsing.googleapis.com"
  MINIO_ENDPOINT: "your-minio-endpoint" # 실제 MinIO 엔드포인트로 변경 필요
  MINIO_BUCKET_NAME: "qrust"

  # Spring Boot가 읽을 application.yml
  application.yml: |-
    server:
      port: 8080

    spring:
      datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
        driver-class-name: com.mysql.cj.jdbc.Driver
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            format_sql: true
      data:
        redis:
          host: ${REDIS_HOST}
          port: 6379

    google:
      safe-browsing:
        api:
          base-url: ${GOOGLE_SAFE_BROWSING_BASE_URL}

    minio:
      endpoint: ${MINIO_ENDPOINT}
      bucketName: ${MINIO_BUCKET_NAME}
